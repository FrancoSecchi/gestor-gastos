[package]
name = "gastos-personales"
version = "0.1.0"
description = "App de gastos personales con análisis AI"
authors = []
edition = "2021"

[lib]
name = "gastos_personales_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
tauri-plugin-http = { version = "2.0" }
tauri-plugin-shell = { version = "2.0" }
tauri-plugin-global-shortcut = { version = "2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

# Pin transitive dependencies that require Rust >= 1.88 to older compatible versions
cookie_store = "=0.21.1"
darling = "=0.20.11"
time = "=0.3.36"
time-core = "=0.1.2"
time-macros = "=0.2.18"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
